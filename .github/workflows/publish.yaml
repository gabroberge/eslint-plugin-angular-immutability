name: Publish
on:
    push:
        branches: ["master"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Trusted publishing (OIDC): https://docs.npmjs.com/trusted-publishers
# Changesets needs write access to push version commits / tags and manage release PRs.
permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Node 24 bundles npm 11+ for OIDC; `changeset publish` uses npm under the hood.
            - name: Set up Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Cache rotation keys
              id: cache-rotation
              shell: bash
              run: |
                  echo "YEAR_MONTH=$(/bin/date -u "+%Y%m")" >> $GITHUB_OUTPUT

            - name: Setup bun cache
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-store-cache-${{ steps.cache-rotation.outputs.YEAR_MONTH }}-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-store-cache-${{ steps.cache-rotation.outputs.YEAR_MONTH }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile
              env:
                  HUSKY: "0"

            - name: Use npm with OIDC trusted publishing support
              run: npm install -g 'npm@^11.5.1'

            - name: Create Release Pull Request or Publish
              id: changesets
              uses: changesets/action@v2
              with:
                  publish: bun run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
