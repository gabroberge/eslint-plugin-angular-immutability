name: CI

on:
    push:
        branches:
            - master
            - dev
    pull_request:

permissions:
    contents: read

jobs:
    commitlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # commitlint --from base..head needs both SHAs in the object database; a shallow
                  # clone (default) often omits the PR base, causing "Invalid revision range".
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            # Root package only — commitlint does not need apps/* or packages/*.
            - name: Install commitlint dependencies
              run: HUSKY=0 bun install --frozen-lockfile --filter ./

            - name: Validate current commit (last commit) with commitlint
              if: github.event_name == 'push'
              run: bunx commitlint --last --verbose

            - name: Validate PR commits with commitlint
              if: github.event_name == 'pull_request'
              run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    oxfmt:
        needs: commitlint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version-file: package.json

            # Root package only — oxfmt does not need apps/* or packages/*.
            - name: Install oxfmt dependencies
              run: HUSKY=0 bun install --frozen-lockfile --filter ./

            - name: Oxfmt
              run: bun run format:check

    packages:
        needs: oxfmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # --affected needs the merge base in the object database.
                  fetch-depth: 0

            - uses: ./.github/actions/setup-bun-with-cache

            - name: Build, lint, and test
              run: bunx turbo run build lint test --affected

            - name: Typecheck
              run: bun run typecheck
