version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore(actions)"
      assignees:
          - gabroberge

    - package-ecosystem: "bun"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      commit-message:
          prefix: "chore(bun)"
      assignees:
          - gabroberge
